services:
  api:
    build: .
    container_name: ias-api
    environment:
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - .:/app
    command: npm run start:dev
  
  postgres:
    image: postgres:16
    container_name: ias-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 148787
      POSTGRES_DB: ias-db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ias-redis
    ports:
      - "6379:6379"

  redis-insight:
    image: redis/redisinsight:latest
    container_name: ias-redis-insight
    ports:
      - "5540:5540" 
    depends_on:
      - redis

volumes:
  pgdata: